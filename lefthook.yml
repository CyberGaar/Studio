pre-commit:
  parallel: false
  commands:
    staged-task-allowlist:
      run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-staged-allowlist.ps1
    phase-zero-validation:
      run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/validate-phase0.ps1
    targeted-semgrep:
      run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-targeted-semgrep.ps1
    staged-secret-scan:
      run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-staged-gitleaks.ps1

pre-push:
  parallel: false
  commands:
    public-disclosure-gate:
      run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-public-disclosure.ps1
    phase-zero-validation:
      run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/validate-phase0.ps1
    repository-secret-scan:
      run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-repository-gitleaks.ps1
