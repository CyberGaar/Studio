name: CodeQL

on:
  schedule:
    - cron: '17 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-source:
    name: Detect supported source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      javascript: ${{ steps.detect.outputs.javascript }}
      python: ${{ steps.detect.outputs.python }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect JavaScript, TypeScript, and Python
        id: detect
        shell: bash
        run: |
          javascript=false
          python=false
          if find . -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.mjs' -o -name '*.cjs' -o -name '*.ts' -o -name '*.tsx' \) -not -path './node_modules/*' -print -quit | grep -q .; then javascript=true; fi
          if find . -type f -name '*.py' -not -path './.venv/*' -print -quit | grep -q .; then python=true; fi
          echo "javascript=$javascript" >> "$GITHUB_OUTPUT"
          echo "python=$python" >> "$GITHUB_OUTPUT"

  javascript:
    name: CodeQL JavaScript and TypeScript
    needs: detect-source
    if: needs.detect-source.outputs.javascript == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml
      - name: Analyze source
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6

  python:
    name: CodeQL Python
    needs: detect-source
    if: needs.detect-source.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: python
          config-file: ./.github/codeql/codeql-config.yml
      - name: Analyze source
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
