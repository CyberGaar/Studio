name: Scheduled repository security

on:
  schedule:
    - cron: '43 3 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-repository-scan:
    name: Full repository scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.3'
      - name: Validate repository bootstrap
        shell: pwsh
        run: ./scripts/validate-phase0.ps1
      - name: Install verified security binaries
        run: |
          bash ./scripts/ci/install-actionlint.sh
          bash ./scripts/ci/install-gitleaks.sh
          bash ./scripts/ci/install-osv-scanner.sh
      - name: Lint workflows
        run: actionlint
      - name: Scan complete Git history for secrets
        run: gitleaks git . --config .gitleaks.toml --redact --verbose
      - name: Scan dependency manifests
        run: osv-scanner scan source --recursive .
      - name: Detect source for Semgrep
        id: source
        shell: bash
        run: |
          present=false
          if find . -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.mjs' -o -name '*.cjs' -o -name '*.ts' -o -name '*.tsx' -o -name '*.py' \) -not -path './node_modules/*' -not -path './.venv/*' -print -quit | grep -q .; then present=true; fi
          echo "present=$present" >> "$GITHUB_OUTPUT"
      - name: Install pinned Semgrep
        if: steps.source.outputs.present == 'true'
        run: python -m pip install --disable-pip-version-check --no-cache-dir semgrep==1.172.0
      - name: Run full Semgrep scan
        if: steps.source.outputs.present == 'true'
        run: semgrep scan --config .semgrep.yml --error .
